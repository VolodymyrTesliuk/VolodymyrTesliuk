<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 80" width="768" height="80" role="img" aria-label="Education">
  <title>Education</title>
  <style>
    .c-primary { fill: #10b981; }
    .c-text    { fill: #3f3f46; }
    .c-muted   { fill: #71717a; }
    .c-stroke  { stroke: #10b981; fill: none; }
    .roundel   { fill: rgba(16,185,129,0.10); }
    .gs-bg     { stop-color: #ffffff; }
    .gs-bgel   { stop-color: #f4f4f5; }
    .gs-p      { stop-color: #10b981; }
    .gs-p0     { stop-color: #10b981; stop-opacity: 0; }
    @keyframes lineShimmer { 0%,100%{opacity:.20} 50%{opacity:.45} }
    .bottom-accent { animation: lineShimmer 4s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="768" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-bg"/>
      <stop offset="100%" class="gs-bgel"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-p"/>
      <stop offset="100%" class="gs-p0"/>
    </linearGradient>
  </defs>
  <rect width="768" height="80" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="4" height="80" class="c-primary"/>
  <rect x="20" y="20" width="40" height="40" rx="8" class="roundel"/>
  <g class="c-stroke" transform="translate(28,28)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
  </g>
  <text x="72" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif" font-size="20" font-weight="700" class="c-text">Education</text>
  <text x="72" y="56" font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif" font-size="13" class="c-muted">Computer Science background from Ukrainian university</text>
  <rect class="bottom-accent" x="0" y="77" width="768" height="3" fill="url(#lineGrad)"/>
</svg>
