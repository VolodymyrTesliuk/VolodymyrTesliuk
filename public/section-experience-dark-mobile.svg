<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 64" width="390" height="64" role="img" aria-label="Work Experience">
  <title>Work Experience</title>
  <style>
    .c-primary { fill: #34d399; }
    .c-text    { fill: #e6edf3; }
    .c-stroke  { stroke: #34d399; fill: none; }
    .roundel   { fill: rgba(52,211,153,0.10); }
    .gs-bg     { stop-color: #161b22; }
    .gs-bgel   { stop-color: #21262d; }
    .gs-p      { stop-color: #34d399; }
    .gs-p0     { stop-color: #34d399; stop-opacity: 0; }
    @keyframes lineShimmer { 0%,100%{opacity:.20} 50%{opacity:.45} }
    .bottom-accent { animation: lineShimmer 4s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="390" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-bg"/>
      <stop offset="100%" class="gs-bgel"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-p"/>
      <stop offset="100%" class="gs-p0"/>
    </linearGradient>
  </defs>
  <rect width="390" height="64" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="4" height="64" class="c-primary"/>
  <rect x="14" y="12" width="40" height="40" rx="8" class="roundel"/>
  <g class="c-stroke" transform="translate(22,20)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
  </g>
  <text x="62" y="38" font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif" font-size="17" font-weight="700" class="c-text">Work Experience</text>
  <rect class="bottom-accent" x="0" y="61" width="390" height="3" fill="url(#lineGrad)"/>
</svg>
