<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <!-- Elevated background -->
  <rect width="1200" height="80" fill="#1f1c1d"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="80" fill="#10b981"/>
  <!-- Icon roundel -->
  <rect x="20" y="20" width="40" height="40" rx="8" fill="#10b981" fill-opacity="0.1"/>
  <!-- briefcase icon (Lucide, 24×24 at translate 28,28) -->
  <g transform="translate(28,28)" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
  </g>
  <!-- Title -->
  <text x="72" y="34" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#f4f4f5">Work Experience</text>
  <!-- Description -->
  <text x="72" y="57" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="13" fill="#a1a1aa">8+ years delivering production apps for clients across CZ, UK, US, UA and SE</text>
  <!-- Bottom accent -->
