<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 280" width="390" height="280" role="img" aria-label="Volodymyr Tesliuk — Frontend Vue.js / Nuxt.js Engineer">
  <title>Volodymyr Tesliuk — Frontend Vue.js / Nuxt.js Engineer</title>
  <style>
    .bg        { fill: #0d1117; }
    .bg-el     { fill: #161b22; }
    .c-text    { fill: #e6edf3; }
    .c-muted   { fill: #8b949e; }
    .c-primary { fill: #34d399; }
    .gs-p      { stop-color: #34d399; }
    .gs-p0     { stop-color: #34d399; stop-opacity: 0; }
    .gs-pm     { stop-color: #34d399; stop-opacity: 0.82; }
    .gs-bg     { stop-color: #0d1117; }
    .gs-bgel   { stop-color: #161b22; }
    .divider   { stroke: #30363d; stroke-opacity: 0.55; }
    @keyframes glowBreath { 0%,100%{opacity:.07} 50%{opacity:.20} }
    @keyframes lineShimmer { 0%,100%{opacity:.52} 50%{opacity:1.00} }
    .glow-blob { animation: glowBreath  6s ease-in-out infinite; }
    .top-line  { animation: lineShimmer 4s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="390" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-bg"/>
      <stop offset="100%" class="gs-bgel"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="390" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-p0"/>
      <stop offset="12%"  class="gs-pm"/>
      <stop offset="50%"  class="gs-p"/>
      <stop offset="88%"  class="gs-pm"/>
      <stop offset="100%" class="gs-p0"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#42d392"/>
      <stop offset="100%" stop-color="#647eff"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="195" cy="0" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-p"/>
      <stop offset="100%" class="gs-p0"/>
    </radialGradient>
  </defs>

  <rect width="390" height="280" fill="url(#bgGrad)"/>
  <rect class="glow-blob" width="390" height="280" fill="url(#glowGrad)"/>
  <rect class="top-line" x="0" y="0" width="390" height="3" fill="url(#lineGrad)"/>

  <!-- Status row -->
  <circle cx="104" cy="32" r="5" class="c-primary"/>
  <circle cx="104" cy="32" r="5" class="c-primary">
    <animate attributeName="r"       values="5;10;5"      dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0;0.45" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="195" y="37" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="11"><tspan font-weight="500" class="c-primary">Open to work</tspan><tspan class="c-muted"> · Remote · Ukraine</tspan></text>

  <!-- Name + Title -->
  <g fill="url(#textGradient)" font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif" font-weight="800">
    <text x="195" y="78" text-anchor="middle"
          font-size="30" letter-spacing="-0.8">Volodymyr Tesliuk</text>
    <text x="195" y="104" text-anchor="middle"
          font-size="13" font-weight="600">Frontend Vue.js / Nuxt.js Engineer</text>
  </g>

  <!-- Summary -->
  <text x="195" y="128" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="10" class="c-muted">Vue.js · Nuxt.js · TypeScript · SSR · Composition API</text>
  <text x="195" y="143" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="10" class="c-muted">Pinia · GraphQL · TailwindCSS · i18n · CZ · UK · US · UA</text>

  <!-- Divider -->
  <line x1="60" y1="160" x2="330" y2="160" stroke-width="1" class="divider"/>

  <!-- Stat pills 2×2 grid -->
  <rect x="70"  y="172" width="120" height="22" rx="11" class="bg-el"/>
  <text x="130" y="187" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="11" font-weight="600" class="c-primary">8+ years</text>

  <rect x="200" y="172" width="120" height="22" rx="11" class="bg-el"/>
  <text x="260" y="187" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="11" class="c-muted">CZ · UK · US · UA</text>

  <rect x="70"  y="202" width="120" height="22" rx="11" class="bg-el"/>
  <text x="130" y="217" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="11" class="c-muted">Remote ✓</text>

  <rect x="200" y="202" width="120" height="22" rx="11" class="bg-el"/>
  <text x="260" y="217" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="11" class="c-muted">B2 English</text>

  <rect x="0" y="277" width="390" height="3" fill="url(#lineGrad)" opacity="0.28"/>
</svg>
