<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80" role="img" aria-label="Let's Work Together">
  <title>Let's Work Together</title>
  <style>
    .bg        { fill: #f4f4f5; }
    .c-primary { fill: #10b981; }
    .c-text    { fill: #3f3f46; }
    .c-muted   { fill: #71717a; }
    .c-stroke  { stroke: #10b981; fill: none; }
    .roundel   { fill: rgba(16,185,129,0.10); }
    .gs-bg     { stop-color: #f4f4f5; }
    .gs-bgel   { stop-color: #e4e4e7; }
    .gs-p      { stop-color: #10b981; }
    .gs-p0     { stop-color: #10b981; stop-opacity: 0; }
    @keyframes lineShimmer { 0%,100%{opacity:.20} 50%{opacity:.45} }
    .bottom-accent { animation: lineShimmer 4s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-bg"/>
      <stop offset="100%" class="gs-bgel"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-p"/>
      <stop offset="100%" class="gs-p0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="80" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="4" height="80" class="c-primary"/>
  <rect x="20" y="20" width="40" height="40" rx="8" class="roundel"/>
  <g class="c-stroke" transform="translate(28,28)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="16" rx="2"/>
    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
  </g>
  <text x="72" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif" font-size="20" font-weight="700" class="c-text">Let's Work Together</text>
  <text x="72" y="57" font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif" font-size="13" class="c-muted">Available for remote full-time or contract opportunities</text>
  <rect class="bottom-accent" x="0" y="77" width="1200" height="3" fill="url(#lineGrad)"/>
</svg>
