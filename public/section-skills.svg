<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <!-- Background -->
  <rect width="1200" height="80" fill="#1b1718"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="80" fill="#10b981"/>
  <!-- Icon roundel -->
  <rect x="20" y="20" width="40" height="40" rx="8" fill="#10b981" fill-opacity="0.1"/>
  <!-- code-2 icon (Lucide, 24×24 at translate 28,28) -->
  <g transform="translate(28,28)" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="4,17 10,11 4,5"/>
    <line x1="12" y1="19" x2="20" y2="19"/>
  </g>
  <!-- Title -->
  <text x="72" y="34" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#f4f4f5">Technical Skills</text>
  <!-- Description -->
  <text x="72" y="57" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="13" fill="#a1a1aa">8+ years of frontend development across the full web stack</text>
  <!-- Bottom accent -->
  <rect y="77" width="1200" height="3" fill="#10b981" fill-opacity="0.15"/>
</svg>
