<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Volodymyr Tesliuk — Frontend Vue.js / Nuxt.js Engineer">
  <title>Volodymyr Tesliuk — Frontend Vue.js / Nuxt.js Engineer</title>

  <style>
    /* ── Baked-in light palette ── */
    .bg        { fill: #ffffff; }
    .bg-el     { fill: #f4f4f5; }
    .c-text    { fill: #3f3f46; }
    .c-muted   { fill: #71717a; }
    .c-primary { fill: #10b981; }
    .gs-p      { stop-color: #10b981; }
    .gs-p0     { stop-color: #10b981; stop-opacity: 0; }
    .gs-pm     { stop-color: #10b981; stop-opacity: 0.82; }
    .gs-bg     { stop-color: #ffffff; }
    .gs-bgel   { stop-color: #f4f4f5; }
    .divider   { stroke: #e4e4e7; stroke-opacity: 0.55; }

    /* ── Animations ── */
    @keyframes glowBreath {
      0%, 100% { opacity: 0.07; }
      50%      { opacity: 0.20; }
    }
    @keyframes lineShimmer {
      0%, 100% { opacity: 0.52; }
      50%      { opacity: 1.00; }
    }
    .glow-blob { animation: glowBreath  6s ease-in-out infinite; }
    .top-line  { animation: lineShimmer 4s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-bg"/>
      <stop offset="100%" class="gs-bgel"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-p0"/>
      <stop offset="12%"  class="gs-pm"/>
      <stop offset="50%"  class="gs-p"/>
      <stop offset="88%"  class="gs-pm"/>
      <stop offset="100%" class="gs-p0"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#42d392"/>
      <stop offset="100%" stop-color="#647eff"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="600" cy="0" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="gs-p"/>
      <stop offset="100%" class="gs-p0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect class="glow-blob" width="1200" height="380" fill="url(#glowGrad)"/>
  <rect class="top-line" x="0" y="0" width="1200" height="3" fill="url(#lineGrad)"/>

  <!-- Status row -->
  <circle cx="450" cy="62" r="5" class="c-primary"/>
  <circle cx="450" cy="62" r="5" class="c-primary">
    <animate attributeName="r"       values="5;10;5"      dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0;0.45" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="464" y="67"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="13" font-weight="500" class="c-primary">Open to work</text>
  <text x="550" y="67"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="13" class="c-muted"> · Remote · Poltava, Ukraine</text>

  <!-- Name + Title -->
  <g fill="url(#textGradient)" font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif" font-weight="800">
    <text x="600" y="148" text-anchor="middle"
          font-size="54" letter-spacing="-1.5">Volodymyr Tesliuk</text>
    <text x="600" y="188" text-anchor="middle"
          font-size="22" font-weight="600">Frontend Vue.js / Nuxt.js Engineer</text>
  </g>

  <!-- Summary -->
  <text x="600" y="224" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="13" class="c-muted">
        8+ years delivering responsive, high-performance web apps with Vue.js (2/3) and Nuxt.js (2/3/4).
  </text>
  <text x="600" y="244" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="13" class="c-muted">
        TypeScript · SSR · Composition API · Pinia · GraphQL · TailwindCSS · CZ · UK · US · SE · UA
  </text>

  <!-- Divider -->
  <line x1="402" y1="270" x2="798" y2="270" stroke-width="1" class="divider"/>

  <!-- Stat pills -->
  <rect x="402" y="284" width="92"  height="24" rx="12" class="bg-el"/>
  <text x="448" y="300" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="12" font-weight="600" class="c-primary">8+ years</text>

  <rect x="502" y="284" width="132" height="24" rx="12" class="bg-el"/>
  <text x="568" y="300" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="12" class="c-muted">CZ · UK · US · SE · UA</text>

  <rect x="644" y="284" width="80"  height="24" rx="12" class="bg-el"/>
  <text x="684" y="300" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="12" class="c-muted">Remote ✓</text>

  <rect x="734" y="284" width="88"  height="24" rx="12" class="bg-el"/>
  <text x="778" y="300" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="12" class="c-muted">B2 English</text>


  <rect x="0" y="376" width="1200" height="4" fill="url(#lineGrad)" opacity="0.28"/>
</svg>
